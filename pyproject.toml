[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-denoise"
version = "0.1.0"
description = "Stateful 2 kHz sEMG denoising with a 50 Hz IIR comb and gated SWT enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "PyWavelets>=1.5,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/qinminghui869-sys/emg-denoise"
Issues = "https://github.com/qinminghui869-sys/emg-denoise/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "build>=1.2,<2",
    "twine>=6,<7",
]

[project.scripts]
emg-denoise = "emg_denoise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emg_denoise = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/emg_denoise"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pywt.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["emg_denoise"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
